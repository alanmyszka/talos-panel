name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check talos_panel tests migrations
      - run: pytest
      - run: python -m compileall -q talos_panel tests migrations
      - run: docker compose config --quiet
