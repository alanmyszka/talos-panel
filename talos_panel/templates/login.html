{% extends "base.html" %}
{% block title %}{{ t("Log in") }} · Talos Panel{% endblock %}
{% block content %}
<section class="auth-card card"><p class="eyebrow">TALOS PANEL</p><h1>{{ t("Welcome back") }}</h1><p>{{ t("Log in to manage your Minecraft servers.") }}</p>{% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="form auth-form"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>{{ t("Password") }}<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">{{ t("Log in") }}</button></form></section>
{% endblock %}
