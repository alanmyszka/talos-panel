{% extends "base.html" %}
{% block title %}{{ t("Log in") }} · Talos Panel{% endblock %}
{% block content %}
<section class="auth-card card"><p class="app-brand"><strong>Talos Panel<strong></p><h1>{{ t("Welcome back") }}</h1><p>{{ t("Log in to manage your Minecraft servers.") }}</p>{% if error %}<div class="notice notice-error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="form auth-form"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>{{ t("Password") }}<input type="password" name="password" required autocomplete="current-password"></label><label>{{ t("Authentication or recovery code") }} <span class="hint">({{ t("if enabled") }})</span><input type="text" name="totp_code" autocomplete="one-time-code" maxlength="32"></label><button type="submit">{{ t("Log in") }}</button></form></section>
{% endblock %}
