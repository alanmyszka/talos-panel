<div class="sidebar-utilities">
  <a class="sidebar-identity" href="/account"><span class="identity-avatar material-symbols-rounded">person</span><span><strong>{{ request.state.user.email }}</strong><small>{{ request.state.user.role.value }}</small></span><span class="material-symbols-rounded identity-chevron">chevron_right</span></a>
  <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}"><button class="link-button sidebar-action" type="submit"><span class="material-symbols-rounded">logout</span>{{ t("Log out") }}</button></form>
  <div class="language-switch" aria-label="Language">
    <form method="post" action="/language/en"><input type="hidden" name="next_path" value="{{ request.url.path }}"><button class="{% if lang == 'en' %}active{% endif %}" type="submit">EN</button></form>
    <form method="post" action="/language/pl"><input type="hidden" name="next_path" value="{{ request.url.path }}"><button class="{% if lang == 'pl' %}active{% endif %}" type="submit">PL</button></form>
  </div>
</div>
