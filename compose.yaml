name: talos-panel

services:
  panel:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talos_panel}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-talos_panel}
      SECRET_FILE: /data/secrets/app-secret
      MINECRAFT_DATA_ROOT: /data
      MINECRAFT_HOST_DATA_ROOT: ${BASE_DIR:-$PWD}
      MINECRAFT_NETWORK: talos-network
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BASE_DIR:-$PWD}/servers:/data/servers
      - ${BASE_DIR:-$PWD}/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talos_panel}
      POSTGRES_USER: ${POSTGRES_USER:-talos_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
